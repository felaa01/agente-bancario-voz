name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formato (ruff format --check)
        run: uv run ruff format --check .

      - name: Tipos (mypy)
        run: uv run mypy src pruebas

      - name: Pruebas (sin en_vivo)
        run: uv run pytest -m "not en_vivo"
