[project]
name = "agente-voz"
version = "0.1.0"
description = "Agente bancario de voz en espanol: agente con herramientas, RAG y evaluacion de punta a punta."
readme = "README.md"
authors = [
    { name = "Juan Andres", email = "jandrestn2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.39.0",
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "pruebas"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "ANN"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["prueba_*.py"]
python_functions = ["prueba_*"]
asyncio_mode = "auto"
markers = [
    "en_vivo: prueba que llama a un LLM real; queda fuera del CI (correr con -m en_vivo)",
]
addopts = "--cov=src --cov-report=term-missing"
